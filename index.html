<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>All Supplier Outstanding Report</title>

<style>

body{
    font-family:Arial;
    margin:20px;
    background:#f5f5f5;
}

h2{
    text-align:center;
    color:#1565C0;
}

.filter{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
    margin-bottom:20px;
}

input{
    padding:10px;
    font-size:16px;
    width:100%;
    box-sizing:border-box;
}

button{
    padding:10px;
    font-size:16px;
    cursor:pointer;
    background:#1565C0;
    color:white;
    border:none;
}

button:hover{
    background:#0D47A1;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin:20px 0;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    text-align:center;
}

.card h3{
    margin:0;
    color:#555;
}

.card h2{
    margin-top:10px;
    color:#1565C0;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

table,th,td{
    border:1px solid #ccc;
}

th{
    background:#1565C0;
    color:white;
}

th,td{
    padding:10px;
    text-align:center;
}

tr:nth-child(even){
    background:#f9f9f9;
}

tfoot{
    font-weight:bold;
    background:#eeeeee;
}

</style>

</head>

<body>

<h2>All Supplier Outstanding Report</h2>

<div class="filter">

<div>
<label>Search Supplier</label>

<input
type="text"
id="search"
list="customerList"
placeholder="Type Customer Name">

<datalist id="customerList"></datalist>
</div>

<div>
<label>From Date</label>
<input type="date" id="fromDate">
</div>

<div>
<label>To Date</label>
<input type="date" id="toDate">
</div>

<div style="display:flex;align-items:end;">
<button onclick="loadReport()">
Search
</button>
</div>

</div>

<div class="cards">

<div class="card">
<h3>Total Purchase</h3>
<h2>₹ <span id="totalSales">0</span></h2>
</div>

<div class="card">
<h3>Total Payment Paid</h3>
<h2>₹ <span id="totalPayment">0</span></h2>
</div>

<div class="card">
<h3>Total Outstanding</h3>
<h2>₹ <span id="totalOutstanding">0</span></h2>
</div>

</div>

<table>

<thead>

<tr>

<th>Supplier Name</th>
<th>Total Purchase</th>
<th>Total Payment Paid</th>
<th>Outstanding</th>

</tr>

</thead>

<tbody id="tbody">

</tbody>

<tfoot>

<tr>

<td>Grand Total</td>

<td id="gSales">0</td>

<td id="gPayment">0</td>

<td id="gOutstanding">0</td>

</tr>

</tfoot>

</table>

<script type="module">
    

   



    
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

// ---------------- Firebase ----------------

const firebaseConfig = {

  apiKey: "AIzaSyBOw2CG4-8JWYNl5hf3aR7yCPjcPI41IC0",
  authDomain: "ommtaxsolutions.firebaseapp.com",
  projectId: "ommtaxsolutions",
  storageBucket: "ommtaxsolutions.firebasestorage.app",
  messagingSenderId: "944702919466",
  appId: "1:944702919466:web:6f37b36e1d5cf6d7a54453",
  measurementId: "G-NNTHM5Y4B8"


};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {

    if (!user) {
        window.location.href = "https://ommtaxsurada-sudo.github.io/ommtaxlogin/";
        return;
    }

    console.log("Authorized user:", user.uid);

});

    
async function loadSupplierList(){

    const snapshot = await getDocs(collection(db,"suppliers"));

    let options = "";

    snapshot.forEach(doc=>{

        let data = doc.data();

        options += `<option value="${data.name}"></option>`;

    });

    document.getElementById("customerList").innerHTML = options;

}

// ---------------- Report ----------------

window.loadReport = async function(){

    let search = document.getElementById("search").value.toLowerCase();

    let from = document.getElementById("fromDate").value;

    let to = document.getElementById("toDate").value;

    let ledger = {};

    // ---------------- PURCHASE ----------------

    const purchaseSnap = await getDocs(collection(db,"purchases"));

    purchaseSnap.forEach(doc=>{

        let d = doc.data();

        if(from && d.date < from) return;
        if(to && d.date > to) return;

        if(search && !d.name.toLowerCase().includes(search)) return;

        if(!ledger[d.name]){

            ledger[d.name]={
                purchase:0,
                payment:0
            };

        }

        ledger[d.name].purchase += Number(d.payment || 0);

    });

    // ---------------- PAYMENT PAID ----------------

    const paymentSnap = await getDocs(collection(db,"supplierPayments"));

    paymentSnap.forEach(doc=>{

        let d = doc.data();

        if(from && d.date < from) return;
        if(to && d.date > to) return;

        if(search && !d.name.toLowerCase().includes(search)) return;

        if(!ledger[d.name]){

            ledger[d.name]={
                purchase:0,
                payment:0
            };

        }

        ledger[d.name].payment += Number(d.payment || 0);

    });

    displayReport(ledger);

}

    // -------- PAYMENTS --------

    


function displayReport(ledger){

    let html="";

    let grandPurchase=0;
    let grandPayment=0;
    let grandOutstanding=0;

    let names = Object.keys(ledger).sort();

    names.forEach(name=>{

        let purchase = ledger[name].purchase;
        let payment = ledger[name].payment;
        let outstanding = purchase - payment;

        grandPurchase += purchase;
        grandPayment += payment;
        grandOutstanding += outstanding;

        html += `
        <tr>

            <td style="text-align:left">${name}</td>

            <td>₹ ${purchase.toLocaleString('en-IN')}</td>

            <td>₹ ${payment.toLocaleString('en-IN')}</td>

            <td style="
                color:${outstanding>0?'red':'green'};
                font-weight:bold;">
                ₹ ${outstanding.toLocaleString('en-IN')}
            </td>

        </tr>
        `;

    });

    if(names.length==0){

        html=`
        <tr>
            <td colspan="4">No Records Found</td>
        </tr>
        `;

    }

    document.getElementById("tbody").innerHTML=html;

    document.getElementById("gSales").innerHTML =
        "₹ "+grandPurchase.toLocaleString('en-IN');

    document.getElementById("gPayment").innerHTML =
        "₹ "+grandPayment.toLocaleString('en-IN');

    document.getElementById("gOutstanding").innerHTML =
        "₹ "+grandOutstanding.toLocaleString('en-IN');

    document.getElementById("totalSales").innerHTML =
        grandPurchase.toLocaleString('en-IN');

    document.getElementById("totalPayment").innerHTML =
        grandPayment.toLocaleString('en-IN');

    document.getElementById("totalOutstanding").innerHTML =
        grandOutstanding.toLocaleString('en-IN');

}

// Load report automatically
loadSupplierList();
loadReport();

/* Disable right-click */
document.addEventListener("contextmenu", function(event) {
    event.preventDefault();
});


/* Disable F12 */
document.addEventListener("keydown", function(event) {

    if (event.key === "F12") {
        event.preventDefault();
    }

    /* Disable Ctrl + Shift + I */
    if (
        event.ctrlKey &&
        event.shiftKey &&
        event.key.toLowerCase() === "i"
    ) {
        event.preventDefault();
    }

    /* Disable Ctrl + Shift + J */
    if (
        event.ctrlKey &&
        event.shiftKey &&
        event.key.toLowerCase() === "j"
    ) {
        event.preventDefault();
    }

    /* Disable Ctrl + U */
    if (
        event.ctrlKey &&
        event.key.toLowerCase() === "u"
    ) {
        event.preventDefault();
    }

    /* Disable Ctrl + S */
    if (
        event.ctrlKey &&
        event.key.toLowerCase() === "s"
    ) {
        event.preventDefault();
    }

});
    
</script>

</body>
</html>
